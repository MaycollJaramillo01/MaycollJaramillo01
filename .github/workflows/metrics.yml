# .github/workflows/metrics.yml
#
# Genera assets/metrics.svg, assets/metrics.languages.svg y assets/metrics.habits.svg
# y los commitea al repo.
# Requiere un secret llamado METRICS_TOKEN (PAT CLASSIC, no fine-grained).
# Scopes recomendados: public_repo, read:user, read:org

name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # 1) Tarjeta principal: cabecera, actividad, comunidad, repos y calendario anual
      - name: Base metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MaycollJaramillo01
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Managua
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_lines: yes
          plugin_achievements: yes
          plugin_achievements_only: developer, maintainer, stargazer, deployer
          plugin_achievements_threshold: B

      # 2) Distribucion de lenguajes por bytes y actividad reciente
      - name: Languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MaycollJaramillo01
          filename: assets/metrics.languages.svg
          base: ""
          config_timezone: America/Managua
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: no

      # 3) Habitos de desarrollo: horas activas, dias e indentacion
      - name: Habits metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MaycollJaramillo01
          filename: assets/metrics.habits.svg
          base: ""
          config_timezone: America/Managua
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          plugin_habits_facts: yes
          plugin_habits_days: 14

# Para probar combinaciones de plugins y copiar el YAML generado:
# https://metrics.lecoq.io
